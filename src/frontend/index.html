<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta OBS</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- CONTENEDOR PRINCIPAL: Mantiene todo alineado en fila -->
    <div class="widget-wrapper">

        <!-- CÍRCULO CON LOGOS -->
        <div class="logo-container" ">
            <!--Logo principal al inicio de la animacion-->
            <img class=" logo-xbox" id="logo_xbox" src="./assets/image/logo xbox/xbox.png" alt="xbox">
            <!-- Logo secundario, luego de la primera animacion -->
            <img class="logo-nuevo" id="logo_bits" src="" alt="nuevo logo">
        </div>

        <!-- BANNER DE MENSAJE -->
        <div class="container_message">
            <!--Banner de mensajes | Contenedor del texto y el fondo | Se expande al recibir el mensaje-->
            <div class="container_message_text" id="container_message_text">
                <!--Header del mensaje | Se posiciona en la parte superior del banner -->
                <div class="message_header" id="header_message">¡BLOQUE DE BITS RECIBIDO!</div>
                <!--Footer del mensaje | Se posiciona en la parte inferior del banner -->
                <div class="message_footer" id="footer_message">1000 bits</div>
            </div>
        </div>

    </div>

    <!-- <script type="module" src="./js/main.js"></script> -->
    <script type="module" src="./js/main.js"></script>
</body>

</html>
